name: 🎪 Deploy THE CAR SHOW to GitHub Pages

# This repo is a living public lane mirrored from the private drasticstatic/taylordwraps (carshow/).
# Edits land there; this workflow only publishes what arrives. Static files, no build step, no secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site/
        run: |
          set -euo pipefail
          mkdir -p site
          cp -- *.html styles.css app.js site/
          for d in assets fonts archive shared; do [ -d "$d" ] && cp -r "$d" site/; done
          touch site/.nojekyll
          echo "files: $(find site -type f | wc -l)"
          test -f site/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
