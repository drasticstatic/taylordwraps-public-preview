name: 🎪 Deploy THE CAR SHOW to GitHub Pages

# This repo is a living public lane mirrored from the private drasticstatic/taylordwraps (carshow/).
# Edits land there; this workflow only publishes what arrives. Static files, no build step, no secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The same two scripts run in the private repo's guardrails, so what was checked is what ships.
      - name: Assemble site/ and check every local reference resolves
        run: |
          sh scripts/assemble.sh site
          node scripts/check-site.mjs site

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
