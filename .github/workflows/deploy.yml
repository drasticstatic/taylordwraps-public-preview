name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap signed bundle (first run only)
        if: ${{ hashFiles('index.html') == '' }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, zipfile, io
          m = json.load(open('.bootstrap/bundle.json'))
          req = urllib.request.Request(m['url'], headers={'User-Agent': 'taylordwraps-ci/1.0'})
          data = urllib.request.urlopen(req, timeout=120).read()
          assert hashlib.sha256(data).hexdigest() == m['sha256'], 'bundle sha mismatch'
          zipfile.ZipFile(io.BytesIO(data)).extractall('.')
          print('bundle verified and extracted')
          PY
          rm -rf .bootstrap
          git config user.name "littlebird-ci[bot]"
          git config user.email "littlebird-ci@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] bootstrap site bundle (signed sha256)"
          git push

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html styles.css app.js site/
          cp -r assets fonts site/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
